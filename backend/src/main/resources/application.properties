# ----------------------------------------------------
# CONFIGURAÇÃO DO BANCO DE DADOS H2 (COMPLETO)
# ----------------------------------------------------
spring.datasource.url=jdbc:h2:mem:maderixdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 🚨 CORREÇÃO CRÍTICA: FORÇAR O DIALETO H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework.security=DEBUG
logging.level.com.maderix.backend.config=DEBUG